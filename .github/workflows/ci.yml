name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-full:
    name: Windows - full suite (real DPAPI, ACL and SID guards)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run tests
        run: python -m pytest backend/tests -q -rs
      - name: Setup + preflight + app import smoke test
        shell: pwsh
        env:
          SECUREVAULT_CONFIG_FILE: ${{ runner.temp }}\sv\securevault.env
        run: |
          python -m backend.manage setup --runtime-dir "$env:RUNNER_TEMP\sv"
          python -m backend.manage check
          python -c "from backend.api_main import app; assert any(r.path == '/documents/encrypted' for r in app.routes)"
          python -m backend.manage audit-verify

  linux-provider-independent:
    name: Ubuntu - provider-independent suite (master-key provider)
    runs-on: ubuntu-latest
    env:
      SECUREVAULT_KEY_PROVIDER: env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run tests (DPAPI-only tests are skipped)
        run: python -m pytest backend/tests -q -rs
      - name: Setup + preflight + app import smoke test
        env:
          SECUREVAULT_CONFIG_FILE: ${{ runner.temp }}/sv/securevault.env
        run: |
          export SECUREVAULT_MASTER_KEY="$(python -c 'import base64,secrets;print(base64.b64encode(secrets.token_bytes(32)).decode())')"
          python -m backend.manage setup --runtime-dir "$RUNNER_TEMP/sv"
          python -m backend.manage check
          python -c "from backend.api_main import app; assert any(r.path == '/documents/encrypted' for r in app.routes)"
          python -m backend.manage audit-verify
